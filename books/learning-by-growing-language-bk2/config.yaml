title: "育てて学ぶ はじめての自作プログラミング言語 Book 2"
summary: |
  ※ 執筆途中のドラフト状態ですが書いたところまで公開中です。
  ※ そのため、今後修正が入る可能性があります。ご了承ください。

  「育てて学ぶ はじめての自作プログラミング言語 Book 1」 https://zenn.dev/kb84tkhr/books/learning-by-growing-language の続編です。現在、第 2 部 第 4 章 を公開済みです。

  「Python や Ruby みたいなプログラミング言語って、中はどう動いているんだろう？」
  「言語を自作するのって面白そうだけど、難しいんだろうな」

  そんな風に思っている方に読んでみていただきたい「プログラミング言語の作り方」超入門です。
  
  Book 2 では、Book 1 で作成した最小のインタプリタに以下のような変更を加えていきます。

  * 演算子の追加、制御構造の強化、タプル型・配列型・文字列型の導入
  * 辞書型の導入（未稿）
  * パターンマッチの導入（未稿）

  文章も堅苦しくならないよう、リラックスした感じで書いていますので、気軽に読み始めてみてください。ご質問・ご指摘などありましたらぜひ下の方にある「読者コミュニティ」でコメントお願いします！

